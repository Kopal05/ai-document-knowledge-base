services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: smart-knowledge-base-db
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_knowledge_base}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-smart_knowledge_base}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: smart-knowledge-base-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smart_knowledge_base}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMBEDDING_PROVIDER_BASE_URL: ${EMBEDDING_PROVIDER_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_PROVIDER_MODEL: ${EMBEDDING_PROVIDER_MODEL:-nomic-embed-text}
      CHAT_PROVIDER_BASE_URL: ${CHAT_PROVIDER_BASE_URL:-http://host.docker.internal:11434}
      CHAT_PROVIDER_MODEL: ${CHAT_PROVIDER_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgvector_data: