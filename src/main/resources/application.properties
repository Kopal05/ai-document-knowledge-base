# ---------------------------------------------------------------------------
# Application configuration

spring.application.name=smart-knowledge-base
spring.config.import=optional:file:.env[.properties]

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- PostgreSQL connection ---

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=update: Hibernate will automatically create/update tables based
# on your @Entity classes when the app starts. Convenient for early
# development. NOT recommended for production (you'll learn proper schema
# migrations with tools like Flyway/Liquibase later).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Embedding provider ---
# Ollama runs as a separate local process (not part of this Spring Boot
# app) and exposes an HTTP API on port 11434 by default. No API key is
# needed because everything runs on your own machine. base-url and model
# are still externalized via env vars (not hardcoded) because they WILL
# differ between environments — e.g. a different host once this is
# deployed, or a different model if you swap it locally.
#
# Setup (one-time): install Ollama (https://ollama.com), then run:
#   ollama pull nomic-embed-text
# Ollama then serves requests automatically in the background.
embedding.provider.base-url=${EMBEDDING_PROVIDER_BASE_URL:http://localhost:11434}
embedding.provider.model=${EMBEDDING_PROVIDER_MODEL:nomic-embed-text}

# --- Semantic search ---
# Default number of results when a request doesn't specify ?topK=.
# Externalized (not hardcoded in SemanticSearchService) so it can be
# tuned per-environment without a code change.
search.default-top-k=${SEARCH_DEFAULT_TOP_K:5}

# --- Chat / answer generation provider ---
# Independently configurable from embedding.provider.* above, even
# though both default to the same local Ollama instance — see
# ChatClientConfig for why they're kept as separate beans rather than
# sharing one. llama3.2 is a reasonable default local chat model to
# start with; if it's ever unavailable or you prefer another, this is a
# one-line config change, not a code change:
#   ollama pull llama3.2
chat.provider.base-url=${CHAT_PROVIDER_BASE_URL:http://localhost:11434}
chat.provider.model=${CHAT_PROVIDER_MODEL:llama3.2}

# --- RAG ---
# How many retrieved chunks get fed to the LLM as context per question.
# Kept separate from search.default-top-k above on purpose: "how many
# results to show a human browsing search" and "how many chunks fit
# usefully in an LLM prompt" are related but distinct concerns that may
# need to diverge later (e.g. LLM context-window limits).
rag.context-chunk-count=${RAG_CONTEXT_CHUNK_COUNT:5}

# --- JWT authentication ---
# jwt.secret has NO real default on purpose — JwtService refuses to start
# the application at all if this is blank or shorter than 32 bytes (see
# JwtService's javadoc). You MUST set JWT_SECRET yourself before running
# the app. Generate one locally with:
#   openssl rand -base64 32
# Set it as an environment variable (never commit the real value):
#   export JWT_SECRET=<output of the command above>
# jwt.expiration-ms: how long an issued token stays valid. 3600000 ms =
# 1 hour, a reasonable default for a portfolio project — short enough to
# limit damage from a leaked token, long enough not to be annoying while
# testing.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# --- CORS ---
# The origin allowed to make authenticated cross-origin requests to this
# API — intended for a future React frontend running on its own dev
# server/domain. Deliberately NOT "*" — see SecurityConfig for why.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}